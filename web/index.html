<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yoga Pose Demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 1.5rem auto; padding: 0 1rem; }
  .tabs { display: flex; gap: .5rem; margin-bottom: 1rem; }
  .tabs button { flex: 1; padding: .6rem; border: 1px solid #ccc; background: #f4f4f4; cursor: pointer; }
  .tabs button.active { background: #333; color: #fff; }
  .panel { display: none; }
  .panel.active { display: block; }
  #uploadCanvas { max-width: 100%; margin-top: 1rem; border: 1px solid #ccc; display: block; }
  #resultCards { margin-top: 1rem; display: flex; flex-direction: column; gap: .5rem; }
  .detCard { border: 1px solid #ddd; border-left: 4px solid #999; border-radius: 4px; padding: .5rem .8rem; }
  .detCard.ok { border-left-color: limegreen; }
  .detCard.bad { border-left-color: #d9362f; }
  .detCard .detHead { display: flex; justify-content: space-between; align-items: center; gap: .5rem; font-weight: 600; }
  .detCard .detStatus { font-size: .8rem; font-weight: 600; white-space: nowrap; }
  .detCard .detStatus.ok { color: #1a7f37; }
  .detCard .detStatus.bad { color: #d9362f; }
  .detCard ul { margin: .4rem 0 0; padding-left: 1.1rem; font-size: .85rem; color: #444; }
  #resultRaw { margin-top: .8rem; font-size: .8rem; color: #666; }
  #resultRaw summary { cursor: pointer; }
  #result { margin-top: .4rem; white-space: pre-wrap; font-family: monospace; font-size: .8rem; }
  #camWrap { position: relative; width: 100%; margin-top: 1rem; }
  #camVideo { width: 100%; display: block; background: #000; }
  #camOverlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .camControls { display: flex; gap: .5rem; margin-top: .5rem; flex-wrap: wrap; }
  .camControls button { padding: .5rem 1rem; }
  .status { font-size: .85rem; color: #666; margin-top: .3rem; }
  code { background: #f0f0f0; padding: 0 .2rem; }
</style>
</head>
<body>
  <h1>Yoga Pose Detection &amp; Form Scoring — Demo</h1>
  <p>API mặc định: <code id="apiUrlLabel"></code> — sửa trong <code>API_BASE</code> ở cuối file nếu deploy nơi khác.</p>

  <div class="tabs">
    <button id="tabCameraBtn" class="active">Camera trực tiếp</button>
    <button id="tabUploadBtn">Upload ảnh</button>
  </div>

  <!-- ===== Live camera (chính — dùng trên điện thoại/iPhone) ===== -->
  <div id="panelCamera" class="panel active">
    <p class="status">
      Cần mở trang này qua <strong>HTTPS</strong> (hoặc <code>localhost</code> khi dev) —
      Safari/Chrome trên điện thoại chặn camera nếu không có HTTPS.
    </p>
    <div id="camWrap">
      <video id="camVideo" playsinline autoplay muted></video>
      <canvas id="camOverlay"></canvas>
    </div>
    <div class="camControls">
      <button id="startCamBtn">Bật camera</button>
      <button id="stopCamBtn" disabled>Tắt camera</button>
      <button id="flipCamBtn" disabled>Đổi camera trước/sau</button>
    </div>
    <div id="camStatus" class="status"></div>
  </div>

  <!-- ===== Upload ảnh tĩnh (phụ, để test nhanh không cần camera) ===== -->
  <div id="panelUpload" class="panel">
    <input type="file" id="fileInput" accept="image/*" />
    <canvas id="uploadCanvas" hidden></canvas>
  </div>

  <div id="resultCards"></div>
  <p id="resultMeta" class="status"></p>
  <details id="resultRaw">
    <summary>Xem dữ liệu JSON gốc</summary>
    <pre id="result"></pre>
  </details>

  <script>
    // Deploy tách frontend/backend (vd trang này host tĩnh trên Cloudflare
    // Pages, API chạy riêng trên Render) -> điền đúng URL backend thật vào
    // đây trước khi deploy (xem docs/specs/g9-deploy-public.md). Để trống
    // ("") nếu frontend + backend cùng origin (backend tự serve trang này
    // qua app/main.py mount static — local `uvicorn --reload`, hoặc mở
    // thẳng URL Render thay vì qua Cloudflare Pages).
    const BACKEND_URL = ""; // vd: "https://yoga-pose-api.onrender.com"

    // Tự nhận diện riêng cho dev local (trang mở qua
    // `python -m http.server 8080`, API chạy riêng ở :8000, xem
    // docs/specs/g8-web-demo.md) -> trỏ thẳng localhost:8000, không cần
    // sửa BACKEND_URL ở trên cho trường hợp này.
    const API_BASE = location.port === "8080" ? "http://localhost:8000" : BACKEND_URL;
    document.getElementById("apiUrlLabel").textContent = API_BASE + "/predict";

    const result = document.getElementById("result");
    const resultCards = document.getElementById("resultCards");
    const resultMeta = document.getElementById("resultMeta");

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // Hiển thị dễ đọc (card theo từng detection) thay vì chỉ dump JSON thô —
    // JSON gốc vẫn giữ trong <details> bên dưới để debug khi cần.
    function renderResults(data) {
      const detections = data.detections || [];
      resultCards.innerHTML = detections.length
        ? detections
            .map((d) => {
              const cls = d.form_ok === false ? "bad" : "ok";
              const statusText = d.form_ok === false ? "✗ Cần chỉnh form" : d.form_ok === true ? "✓ Form ổn" : "— (không chấm được form)";
              const tipsHtml = d.tips?.length
                ? `<ul>${d.tips.map((t) => `<li>${escapeHtml(t)}</li>`).join("")}</ul>`
                : "";
              return `<div class="detCard ${cls}">
                <div class="detHead">
                  <span>${escapeHtml(d.pose)} — ${Math.round(d.confidence * 100)}%</span>
                  <span class="detStatus ${cls}">${statusText}</span>
                </div>
                ${tipsHtml}
              </div>`;
            })
            .join("")
        : `<p class="status">Không phát hiện được tư thế nào trong ảnh.</p>`;
      resultMeta.textContent = `Thời gian xử lý: ${Math.round(data.latency_ms)}ms`;
      result.textContent = JSON.stringify(data, null, 2);
    }

    function showResultError(message) {
      resultCards.innerHTML = "";
      resultMeta.textContent = "Lỗi: " + message;
      result.textContent = "";
    }

    // ---- Tabs ----
    const tabCameraBtn = document.getElementById("tabCameraBtn");
    const tabUploadBtn = document.getElementById("tabUploadBtn");
    const panelCamera = document.getElementById("panelCamera");
    const panelUpload = document.getElementById("panelUpload");

    function showTab(name) {
      const isCam = name === "camera";
      panelCamera.classList.toggle("active", isCam);
      panelUpload.classList.toggle("active", !isCam);
      tabCameraBtn.classList.toggle("active", isCam);
      tabUploadBtn.classList.toggle("active", !isCam);
      if (!isCam) stopCamera();
    }
    tabCameraBtn.addEventListener("click", () => showTab("camera"));
    tabUploadBtn.addEventListener("click", () => showTab("upload"));

    // ---- Upload ảnh tĩnh ----
    const fileInput = document.getElementById("fileInput");
    const uploadCanvas = document.getElementById("uploadCanvas");
    const uploadCtx = uploadCanvas.getContext("2d");

    function loadImageFile(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);
        img.onload = () => { URL.revokeObjectURL(objectUrl); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("Không đọc được ảnh")); };
        img.src = objectUrl;
      });
    }

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      resultCards.innerHTML = "";
      resultMeta.textContent = "Đang gọi API...";
      try {
        const img = await loadImageFile(file);
        // Vẽ ảnh đúng độ phân giải gốc lên canvas -- box API trả về cũng ở
        // toạ độ pixel của chính ảnh gốc này, nên không cần quy đổi gì
        // thêm (khác trường hợp camera phải đồng bộ kích thước video).
        uploadCanvas.width = img.naturalWidth;
        uploadCanvas.height = img.naturalHeight;
        uploadCtx.drawImage(img, 0, 0);
        uploadCanvas.hidden = false;

        const data = await callPredict(file);
        uploadCtx.drawImage(img, 0, 0); // vẽ lại ảnh gốc trước khi đè box mới, tránh chồng box cũ nếu upload lại
        drawDetectionsOnto(uploadCtx, data.detections || []);
        renderResults(data);
      } catch (err) {
        showResultError(err.message);
      }
    });

    // ---- Camera trực tiếp ----
    const camVideo = document.getElementById("camVideo");
    const camOverlay = document.getElementById("camOverlay");
    const camStatus = document.getElementById("camStatus");
    const startCamBtn = document.getElementById("startCamBtn");
    const stopCamBtn = document.getElementById("stopCamBtn");
    const flipCamBtn = document.getElementById("flipCamBtn");
    const ctx = camOverlay.getContext("2d");

    let stream = null;
    let facingMode = "environment"; // "environment" = camera sau, "user" = camera trước
    let loopTimer = null;
    let inFlight = false;
    const CAPTURE_INTERVAL_MS = 400; // ~2.5 fps — cân bằng độ mượt vs băng thông 4G

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        camStatus.textContent = "Trình duyệt không hỗ trợ getUserMedia (hoặc trang chưa chạy qua HTTPS).";
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode },
          audio: false,
        });
        camVideo.srcObject = stream;
        await camVideo.play();
        resizeOverlay();
        startCamBtn.disabled = true;
        stopCamBtn.disabled = false;
        flipCamBtn.disabled = false;
        camStatus.textContent = "Camera đang chạy...";
        loopTimer = setInterval(captureAndPredict, CAPTURE_INTERVAL_MS);
      } catch (err) {
        camStatus.textContent = "Không mở được camera: " + err.message;
      }
    }

    function stopCamera() {
      if (loopTimer) clearInterval(loopTimer);
      loopTimer = null;
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
      ctx.clearRect(0, 0, camOverlay.width, camOverlay.height);
      startCamBtn.disabled = false;
      stopCamBtn.disabled = true;
      flipCamBtn.disabled = true;
      camStatus.textContent = "";
    }

    async function flipCamera() {
      facingMode = facingMode === "environment" ? "user" : "environment";
      stopCamera();
      await startCamera();
    }

    function resizeOverlay() {
      camOverlay.width = camVideo.videoWidth || camVideo.clientWidth;
      camOverlay.height = camVideo.videoHeight || camVideo.clientHeight;
    }

    async function captureAndPredict() {
      if (inFlight || !stream) return; // đợi request trước xong, tránh dồn request khi mạng chậm
      inFlight = true;
      try {
        const canvas = document.createElement("canvas");
        canvas.width = camVideo.videoWidth;
        canvas.height = camVideo.videoHeight;
        canvas.getContext("2d").drawImage(camVideo, 0, 0);
        const blob = await new Promise((resolve) =>
          canvas.toBlob(resolve, "image/jpeg", 0.7) // nén JPEG cho nhẹ mạng di động
        );
        if (!blob) return;
        const data = await callPredict(blob);
        renderCameraDetections(data.detections || []);
        renderResults(data);
      } catch (err) {
        camStatus.textContent = "Lỗi gọi API: " + err.message;
      } finally {
        inFlight = false;
      }
    }

    // Dùng chung cho cả canvas overlay camera (trong suốt, đè lên <video>)
    // lẫn canvas upload (chứa sẵn ảnh, vẽ đè lên) -- không tự clear/resize,
    // đó là việc của nơi gọi (mỗi nơi có ảnh nền khác nhau phía sau).
    function drawDetectionsOnto(targetCtx, detections) {
      targetCtx.lineWidth = 3;
      targetCtx.font = "16px sans-serif";
      for (const d of detections) {
        const [x1, y1, x2, y2] = d.box;
        targetCtx.strokeStyle = d.form_ok === false ? "red" : "limegreen";
        targetCtx.strokeRect(x1, y1, x2 - x1, y2 - y1);
        const label = `${d.pose} (${Math.round(d.confidence * 100)}%)`;
        targetCtx.fillStyle = targetCtx.strokeStyle;
        targetCtx.fillText(label, x1 + 4, Math.max(16, y1 - 6));
        if (d.tips?.length) {
          targetCtx.fillText(d.tips[0], x1 + 4, y2 + 16);
        }
      }
    }

    function renderCameraDetections(detections) {
      resizeOverlay();
      ctx.clearRect(0, 0, camOverlay.width, camOverlay.height);
      drawDetectionsOnto(ctx, detections);
    }

    startCamBtn.addEventListener("click", startCamera);
    stopCamBtn.addEventListener("click", stopCamera);
    flipCamBtn.addEventListener("click", flipCamera);
    window.addEventListener("beforeunload", stopCamera);

    // ---- Shared API call ----
    async function callPredict(fileOrBlob) {
      const form = new FormData();
      form.append("image", fileOrBlob, "frame.jpg");
      const res = await fetch(API_BASE + "/predict", { method: "POST", body: form });
      if (!res.ok) throw new Error(`API lỗi: ${res.status}`);
      return res.json();
    }
  </script>
</body>
</html>
